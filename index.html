<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Enterprise Automation & Webhook Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glow-accent {
            box-shadow: 0 0 25px -5px rgba(239, 68, 68, 0.25);
        }

        .glow-accent-blue {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.25);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen pb-12 overflow-x-hidden selection:bg-red-500 selection:text-white">

    <!-- Top Glow Effects -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-red-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed top-1/3 right-1/4 w-[30rem] h-[30rem] bg-indigo-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- Navigation Header -->
    <header class="border-b border-gray-800/80 bg-gray-950/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 via-orange-500 to-amber-500 flex items-center justify-center shadow-lg shadow-red-500/20">
                    <i class="fa-solid fa-bolt text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
                        n8n Enterprise Suite
                    </h1>
                    <p class="text-[10px] text-gray-400 font-mono">v2.4 Pro • Webhook Testing Engine</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                    Engine Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Left Column: Controls & Dynamic Form (7 Cols) -->
        <div class="lg:col-span-7 space-y-6">

            <!-- Endpoint Configuration Panel -->
            <div class="glass-panel rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-link text-red-400"></i> Target Endpoint Configuration
                    </h2>
                    <span class="text-xs text-gray-400 font-mono">POST Request</span>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">n8n Webhook URL</label>
                        <div class="relative">
                            <input type="url" id="webhookUrl" placeholder="https://primary-n8n.instance.com/webhook/test-event" 
                                class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-red-500/80 focus:ring-1 focus:ring-red-500/80 font-mono transition">
                        </div>
                    </div>

                    <!-- Auth Headers Section -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Authorization (Bearer Token)</label>
                            <input type="password" id="authToken" placeholder="e.g. n8n_api_key_8891..." 
                                class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-red-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Custom Header Key/Value</label>
                            <div class="flex space-x-2">
                                <input type="text" id="customHeaderKey" placeholder="X-API-Key" class="w-1/2 bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2 text-xs text-gray-200">
                                <input type="text" id="customHeaderVal" placeholder="Secret123" class="w-1/2 bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2 text-xs text-gray-200">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preset Action Triggers -->
            <div class="glass-panel rounded-2xl p-6 shadow-2xl">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Preset Event Triggers
                </h2>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="loadPreset('vip')" class="glass-card hover:border-amber-500/50 p-3 rounded-xl text-left transition group">
                        <p class="text-xs font-bold text-amber-400 group-hover:translate-x-1 transition-transform">VIP Lead</p>
                        <p class="text-[10px] text-gray
